services:
  - type: web
    name: lecture-1-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    autoDeployTrigger: checksPass
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lecture-1-db
          property: connectionString

  - type: web
    name: lecture-1-web
    runtime: docker
    plan: free
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    autoDeployTrigger: checksPass
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: lecture-1-api
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: lecture-1-db
    plan: free
