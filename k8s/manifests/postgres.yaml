apiVersion: v1
kind: ConfigMap
metadata:
  name: dating-app-config
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/part-of: dating-app
data:
  POSTGRES_PORT: "${POSTGRES_PORT}"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres
  namespace: ${NAMESPACE}
  labels:
    app: postgres
    app.kubernetes.io/part-of: dating-app
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ${NAMESPACE}
  labels:
    app: postgres
    app.kubernetes.io/part-of: dating-app
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: ${POSTGRES_PORT}
      targetPort: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: ${NAMESPACE}
  labels:
    app: postgres
    app.kubernetes.io/part-of: dating-app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        app.kubernetes.io/part-of: dating-app
    spec:
      securityContext:
        fsGroup: 70
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: ${POSTGRES_PORT}
              name: postgres
          envFrom:
            - configMapRef:
                name: dating-app-config
          env:
            - name: PGPORT
              value: "$(POSTGRES_PORT)"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: dating-app-db
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dating-app-db
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: dating-app-db
                  key: POSTGRES_DB
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U postgres -d dating-app-db -p "$PGPORT"']
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U postgres -d dating-app-db -p "$PGPORT"']
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres
