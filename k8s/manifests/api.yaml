apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: ${NAMESPACE}
  labels:
    app: api
    app.kubernetes.io/part-of: dating-app
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 4000
      targetPort: 4000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: ${NAMESPACE}
  labels:
    app: api
    app.kubernetes.io/part-of: dating-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
        app.kubernetes.io/part-of: dating-app
    spec:
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: dating-app-config
          env:
            - name: PGPORT
              value: "$(POSTGRES_PORT)"
          command:
            - sh
            - -c
            - until pg_isready -h postgres -p "$PGPORT" -U postgres -d dating-app-db; do sleep 2; done
      containers:
        - name: api
          image: ${API_IMAGE}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
              name: http
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "4000"
            - name: DATABASE_SSL
              value: "false"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: dating-app-db
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 256Mi
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
