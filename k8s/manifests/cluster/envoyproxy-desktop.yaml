# Docker Desktop: LoadBalancer с externalTrafficPolicy=Local даёт пустые ответы на localhost.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: dating-app
  namespace: gateway
  labels:
    app.kubernetes.io/part-of: dating-app
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        externalTrafficPolicy: Cluster
