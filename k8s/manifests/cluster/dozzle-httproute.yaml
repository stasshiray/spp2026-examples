apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dozzle-route
  namespace: logs
  labels:
    app: dozzle
    app.kubernetes.io/part-of: dating-app
spec:
  parentRefs:
    - name: main-envoy-gateway
      namespace: gateway
      sectionName: http
  hostnames:
    - "${LOGS_HOST}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      # SSE /api/events is a long-lived stream. Envoy default is 15s; GKE LB default is 30s.
      timeouts:
        request: "86400s"
      backendRefs:
        - name: dozzle
          port: 8080
