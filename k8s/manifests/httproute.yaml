apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app-route
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/part-of: dating-app
spec:
  parentRefs:
    - name: main-envoy-gateway
      namespace: gateway
      sectionName: http
  hostnames:
    - "${INGRESS_HOST}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/me/matches/
      # Chat WebSocket. Envoy's default request timeout is 15s.
      timeouts:
        request: "86400s"
      backendRefs:
        - name: api
          port: 4000
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: api
          port: 4000
    - matches:
        - path:
            type: Exact
            value: /metrics
      backendRefs:
        - name: api
          port: 4000
    - matches:
        - path:
            type: Exact
            value: /openapi.json
        - path:
            type: Exact
            value: /openapi.yaml
      backendRefs:
        - name: api
          port: 4000
    - matches:
        - path:
            type: PathPrefix
            value: /docs
      backendRefs:
        - name: api
          port: 4000
    - matches:
        - path:
            type: Exact
            value: /asyncapi.json
      backendRefs:
        - name: api
          port: 4000
    - matches:
        - path:
            type: PathPrefix
            value: /asyncapi
      backendRefs:
        - name: api
          port: 4000
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: web
          port: 3000
