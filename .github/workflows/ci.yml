name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lecture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lecture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/lecture
      NEXT_PUBLIC_API_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  deploy:
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy API and web to Render
        env:
          api_deploy_url: ${{ secrets.RENDER_API_DEPLOY_HOOK_URL }}
          web_deploy_url: ${{ secrets.RENDER_WEB_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$api_deploy_url" ] || [ -z "$web_deploy_url" ]; then
            echo "Set repository secrets RENDER_API_DEPLOY_HOOK_URL and RENDER_WEB_DEPLOY_HOOK_URL"
            exit 1
          fi
          curl -fsS -X POST "$api_deploy_url"
          curl -fsS -X POST "$web_deploy_url"
